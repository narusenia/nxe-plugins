# One installer per series (`release.yml`), beside the zips: a `.pkg` on macOS,
# an Inno Setup `.exe` on Windows. Each lists the same plugins as its series in
# `series.toml`. The ids end in `-suite` so they never meet a plugin's
# `bundle_id` (`peek` is one).
[[suite]]
name = "NXE Basic"
bundle_id = "basic-suite"
plugins = ["doubler", "sparkleur", "velour", "air", "diorama", "pumice"]
description = "Tools for a vocal mix: Doubler 2, Sparkleur 2, Velour 2, Air 2, Diorama 2 and Pumice."

[[suite]]
name = "NXE Peek"
bundle_id = "peek-suite"
plugins = [
    "peek-level",
    "peek-vu",
    "peek-stereo",
    "peek-spectrum",
    "peek-spectrogram",
    "peek-loudness",
    "peek-scope",
    "peek",
]
description = "Meters that never touch the sound: seven single meters and Peek, which shows them all."

[[suite]]
name = "NXE Kit"
bundle_id = "kit-suite"
plugins = ["fold", "fever", "buckle", "invert", "shear", "afterimage", "dew", "halo", "glint"]
description = "Small sound-design tools: Fold, Fever, Buckle, Invert, Shear, Afterimage, Dew, Halo and Glint."

[[suite]]
name = "NXE Design"
bundle_id = "design-suite"
plugins = ["parasite"]
description = "Tools that remake a sound: Parasite."
