# Tool and task management for nxe-plugins.
#
# `mise run check` is the canonical verification entry point; CI and the
# lefthook pre-commit hook run the same tasks. Run `mise run hooks:install`
# once after cloning to enable the git hooks.

[tools]
rust = { version = "1.95", components = "rustfmt,clippy", profile = "minimal" }
"npm:lefthook" = "2.1.5"
"cargo:cargo-truce" = "6.3.0"

[tasks.fmt]
description = "Check formatting"
run = "cargo fmt --all -- --check"

[tasks."fmt:fix"]
description = "Apply formatting"
run = "cargo fmt --all"

[tasks.clippy]
description = "Clippy with warnings denied"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.test]
description = "Workspace test suite"
# `--no-fail-fast` so one failing crate does not hide another: a run that
# re-bakes several window baselines needs every render.
run = "cargo test --workspace --no-fail-fast"

[tasks.check]
description = "Full verification (fmt + clippy + test)"
depends = ["fmt", "clippy", "test"]

[tasks.gallery]
description = "Run the shared egui widget gallery as a desktop app"
run = "cargo run -p nxe-egui --example gallery"

# **Quit the host before installing.** A host that rescans or has the old
# bundle mapped while it is replaced can read half a bundle; Studio One died
# that way on 2026-08-30 (`SIGKILL (Code Signature Invalid)`).
[tasks.install]
description = "Build one plugin and install it into the user plugin folders (CLAP, VST3, AU)"
run = 'cargo truce install --user --clap --vst3 --au2 -p {{arg(name="plugin")}}'

[tasks."oversampler:design"]
description = "Re-derive Velour's halfband coefficients (stdlib Python only)"
run = "python3 scripts/design-oversampler.py"

[tasks."logo:generate"]
description = "Regenerate the NXE logotype path commands from its SVG"
run = "python3 scripts/generate-logo.py"

[tasks."hooks:install"]
description = "Install lefthook git hooks"
run = "lefthook install"
