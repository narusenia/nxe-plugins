[workspace]
resolver = "2"
members = [
    "crates/nxe-audio",
    "crates/nxe-dsp",
    "crates/nxe-egui",
    "plugins/air/air",
    "plugins/air/air-core",
    "plugins/doubler/doubler-core",
    "plugins/doubler/doubler",
    "plugins/sparkleur/sparkleur",
    "plugins/sparkleur/sparkleur-core",
    "plugins/velour/velour-core",
    "plugins/velour/velour",
    "plugins/diorama/diorama-core",
    "plugins/diorama/diorama",
    "plugins/pumice/pumice-core",
    "plugins/pumice/pumice",
    "plugins/peek/peek-core",
    "plugins/peek/peek-level",
    "plugins/peek/peek-ui",
    "plugins/peek/peek-vu",
    "plugins/peek/peek-stereo",
    "plugins/peek/peek-spectrum",
    "plugins/peek/peek-spectrogram",
    "plugins/peek/peek-loudness",
    "plugins/peek/peek-scope",
    "plugins/peek/peek",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/narusenia/nxe-plugins"

[workspace.dependencies]
nxe-audio = { path = "crates/nxe-audio" }
nxe-dsp = { path = "crates/nxe-dsp" }
nxe-egui = { path = "crates/nxe-egui" }
air = { path = "plugins/air/air" }
air-core = { path = "plugins/air/air-core" }
doubler-core = { path = "plugins/doubler/doubler-core" }
sparkleur-core = { path = "plugins/sparkleur/sparkleur-core" }
velour-core = { path = "plugins/velour/velour-core" }
diorama-core = { path = "plugins/diorama/diorama-core" }
pumice-core = { path = "plugins/pumice/pumice-core" }
peek-core = { path = "plugins/peek/peek-core" }
peek-ui = { path = "plugins/peek/peek-ui" }

# truce (v2). Every truce crate is versioned in lock-step, so they are pinned
# together; a mismatch would put two copies of `truce-core` in the tree.
# **Not `vst3-sys`**: `truce-vst3` builds against the MIT VST3 headers, which
# is what lets a truce plugin leave the GPL side (`LICENSING.md`).
truce = "=6.3.0"
truce-core = "=6.3.0"
truce-params = "=6.3.0"
truce-loader = "=6.3.0"
truce-clap = "=6.3.0"
truce-vst3 = "=6.3.0"
truce-au = "=6.3.0"
truce-egui = "=6.3.0"
truce-test = "=6.3.0"
truce-utils = "=6.3.0"
truce-standalone = "=6.3.0"
clap-sys = "0.5"
egui = "0.34"

# The v0 plugins ran on nih-plug + vizia, through our own forks of vizia and
# baseview (`narusenia/vizia`, `narusenia/baseview`, tag `nxe-2026-08-31c`).
# What those forks fixed — one of them a baseview bug that slowed the whole
# host, the rest the cost of an open window — is in
# `docs/investigations/ui-frame-cost.md`. None of it has gone upstream yet.

# **truce-clap 6.3.0 with two changes**: after a state or preset load it asks the
# host to rescan parameter values, which CLAP requires and clap-validator 0.4
# checks; and a latency change asks for a restart (when active) and announces
# the new value from `activate`, the only place CLAP allows `latency.changed`
# (Pumice is the one plugin whose latency moves). Upstream does neither yet.
# Both are marked `nxe-plugins patch` in `patches/truce-clap/src/lib.rs`; drop this entry once a truce release has it.
#
# **truce-egui 6.3.0 with one addition**: `EguiEditor::with_font_definitions`,
# which installs a whole `FontDefinitions` before the first pass. Upstream's
# `with_font` takes one face, and fonts set from inside the UI only apply from
# the next pass — which `screenshot!` (one pass) never reaches, so the window's
# own faces would never be in a baseline. Marked `nxe-plugins patch` in
# `patches/truce-egui/src/font.rs` and `editor.rs`.
#
# **baseview-truce 0.1.1-truce.13 with one change**: the frame timer runs in
# the run loop's common modes. In the default mode alone it stops while a
# host window is being resized (the event-tracking mode), so a resizable
# editor (`Peek`) froze until the mouse came up. Marked `nxe-plugins patch` in
# `patches/baseview-truce/src/macos/window.rs`.
[patch.crates-io]
baseview-truce = { path = "patches/baseview-truce" }
truce-clap = { path = "patches/truce-clap" }
truce-egui = { path = "patches/truce-egui" }

[profile.release]
lto = "thin"

# An audio plugin built at opt-level 0 cannot keep up with a real-time thread,
# so a debug build is useless in a DAW unless the DSP itself is optimized.
# Scope the cost to the crates that do per-sample work.
[profile.dev.package.nxe-audio]
opt-level = 2

[profile.dev.package.air]
opt-level = 2

[profile.dev.package.air-core]
opt-level = 2

[profile.dev.package.doubler-core]
opt-level = 2

[profile.dev.package.doubler]
opt-level = 2

[profile.dev.package.sparkleur-core]
opt-level = 2

[profile.dev.package.sparkleur]
opt-level = 2

[profile.dev.package.velour-core]
opt-level = 2

[profile.dev.package.velour]
opt-level = 2

[profile.dev.package.pumice-core]
opt-level = 2

[profile.dev.package.pumice]
opt-level = 2
