[workspace]
resolver = "2"
members = [
    "crates/nxe-audio",
    "crates/nxe-dsp",
    "crates/nxe-plug-ui",
    "crates/nxe-ui",
    "plugins/air/air",
    "plugins/air/air-core",
    "plugins/doubler/doubler-core",
    "plugins/doubler/doubler",
    "plugins/sparkleur/sparkleur",
    "plugins/sparkleur/sparkleur-core",
    "plugins/velour/velour-core",
    "plugins/velour/velour",
    "plugins/vocal-depth/vocal-depth-core",
    "plugins/vocal-depth/vocal-depth",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/narusenia/nxe-plugins"

[workspace.dependencies]
nxe-audio = { path = "crates/nxe-audio" }
nxe-dsp = { path = "crates/nxe-dsp" }
nxe-plug-ui = { path = "crates/nxe-plug-ui" }
nxe-ui = { path = "crates/nxe-ui" }
air = { path = "plugins/air/air" }
air-core = { path = "plugins/air/air-core" }
doubler-core = { path = "plugins/doubler/doubler-core" }
sparkleur-core = { path = "plugins/sparkleur/sparkleur-core" }
velour-core = { path = "plugins/velour/velour-core" }
vocal-depth-core = { path = "plugins/vocal-depth/vocal-depth-core" }

# nih-plug is not on crates.io. All three crates come from one repository, so
# they must stay on the same revision — `nih_plug_vizia` and `nih_plug_xtask`
# depend on `nih_plug` by path, and a mismatch would put two copies of it in
# the tree.
#
# `nih_plug`'s default features include `assert_process_allocs`, which panics
# on a heap allocation inside `process()` in debug builds. That is exactly the
# rule `.agents/rules/rust.md` states, enforced by the compiler rather than by
# review — do not turn it off.
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "f36931f7af4646065488a9845d8f8c2f95252c23" }
nih_plug_vizia = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "f36931f7af4646065488a9845d8f8c2f95252c23" }
nih_plug_xtask = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "f36931f7af4646065488a9845d8f8c2f95252c23" }

# This MUST stay byte-identical to what `nih_plug_vizia` depends on
# (Robbert's fork, tag `patched-2024-05-06`). Cargo treats a different git
# source or revision as a *different crate*, so `nxe-ui`'s views would not be
# the same type as the ones `nih_plug_vizia` accepts, and nothing would
# compile. See `docs/specifications/architecture.md`.
#
# `winit` and `baseview` are MUTUALLY EXCLUSIVE. vizia re-exports
# `Application` under `cfg(all(not(feature = "winit"), feature = "baseview"))`
# and the mirror image for winit, so enabling both exports NEITHER and nothing
# that uses `Application` compiles — including `nih_plug_vizia` itself.
#
# Cargo features are additive across the whole graph and cannot be turned off
# per crate, and resolver v2 does not isolate a dev-dependency once a dev
# target is being built. So there is exactly one workable answer:
# **the whole workspace uses `baseview`, and `winit` is never enabled
# anywhere.** `nxe-ui`'s gallery opens a standalone baseview window
# (`Application::run`), which also means the gallery exercises the same
# backend the plugin runs on.
vizia = { git = "https://github.com/robbert-vdh/vizia.git", tag = "patched-2024-05-06", default-features = false, features = [
    "baseview",
    "clipboard",
    "x11",
] }

# **The vizia both of the above resolve to is ours** (`nxe-2026-08-30`, which is
# `patched-2024-05-06` plus three commits), **and so is baseview**
# (`nxe-2026-08-30`, `RustAudio/baseview` plus one). `[patch]` rewrites the
# source for the whole graph, so `nih_plug_vizia`'s vizia and ours stay the same
# crate — which is the constraint the note above is about.
#
# Everything here was found by measuring `mise run gallery` and reading the
# result with `sample`; the numbers and the reasoning are in
# `docs/investigations/ui-frame-cost.md`.
#
# **vizia, from the idle window (27.7 % of a core down to 0.9 %):**
#
# 1. **`vizia_baseview` redrew every frame whether or not anything changed.**
#    `Application::on_frame_update` computes `should_redraw` and `on_frame`
#    never read it. `vizia_winit` does read it — the same flag, honoured. On
#    macOS the frame timer runs on the **host's** run loop, so every redraw was
#    stalling the DAW's own interface.
# 2. **`TextContext::sync_styles` ran a `fontdb` query per text view per
#    frame**, uncached, over a database holding every system font. A quarter of
#    the drawing time.
#
# **vizia, from the moving window (`NXE_GALLERY_HZ=30`, 23.2 % down to 16.2 %):**
#
# 3. **Every view filled a background, stroked a border and stroked an outline
#    whether or not any of them could be seen**, and built the box path to do
#    it with. Most of a tree is containers with none of the three, and femtovg
#    gives every fill and stroke its own draw call — which on Apple Silicon is
#    an OpenGL-over-Metal pipeline build each time.
#
# **baseview and vizia, from the same window (16.2 % down to 14.3 %):**
#
# 4. **The macOS frame timer ran at 66.7 Hz** (`CFRunLoopTimer` at 0.015 s),
#    faster than any common display and faster than anything that feeds it —
#    on the host's run loop. It is 60 Hz now. **Not 30**: 30 was tried and it
#    beats against the plugin's own 30 Hz heartbeat, so some updates land twice
#    in one frame and are drawn once, and the meters stutter. A frame timer has
#    to be faster than whatever feeds it.
# 5. **Input waited for the frame timer.** `vizia_baseview` drew only on the
#    timer's tick, so a drag was answered at the timer's rate rather than the
#    pointer's; it now draws at the end of `on_event` as well. This is what
#    lets the timer be slow without the controls going with it, and it costs
#    nothing when nothing is being touched (the idle window is still 0.9 %).
#
# **vizia and baseview together, the structural one (15.3 % down to 11.0 %):**
#
# 6. **Every frame drew the whole window.** `draw_system` cleared it and walked
#    every view, so a meter moving one pixel re-shaped and re-sent every label
#    on screen — and **63 % of a window's draw calls are text**, nearly all of
#    it labels that never change. It now draws only the box that asked for it
#    and skips any subtree the box does not touch. macOS needs
#    `NSOpenGLPFABackingStore` for that to be sound, or a swap can hand back a
#    buffer holding some earlier frame.
# 7. **A changed string relayouted the tree.** `.text()` always asked for a
#    relayout, so a readout ticking along with the audio re-ran morphorm over
#    every view and cosmic-text over every string, thirty times a second, to
#    put four digits where they were already going to be. It asks only when the
#    view is sized by its contents — which is why `nxe_ui::readout::cell` fixes
#    both of its dimensions.
#
# **baseview, the one that was actually felt (frame block, not CPU):**
#
# 8. **Every frame waited on the window server.** `flushBuffer` on a
#    double-buffered context hands the surface over and blocks until the server
#    takes it — **0.6 ms typically, 13 ms at worst**, forty times a second, on
#    the host's run loop. A host stopped in chunks that long stops tracking the
#    pointer and slides after it, which is what "the DAW's interface moves
#    smoothly instead of instantly" was. The context is single-buffered now, so
#    there is no swap: **0.04 ms typically, 0.2 ms at worst**. What pays for
#    losing the tear-free guarantee is 6 — only the box that changed is drawn,
#    so a tear has nowhere large to happen.
#
# All eight are worth sending upstream; none has been yet.
[patch."https://github.com/RustAudio/baseview.git"]
baseview = { git = "https://github.com/narusenia/baseview.git", tag = "nxe-2026-08-30c" }

[patch."https://github.com/robbert-vdh/vizia.git"]
vizia = { git = "https://github.com/narusenia/vizia.git", tag = "nxe-2026-08-30d" }

[profile.release]
lto = "thin"

# An audio plugin built at opt-level 0 cannot keep up with a real-time thread,
# so a debug build is useless in a DAW unless the DSP itself is optimized.
# Scope the cost to the crates that do per-sample work.
[profile.dev.package.nxe-audio]
opt-level = 2

[profile.dev.package.air]
opt-level = 2

[profile.dev.package.air-core]
opt-level = 2

[profile.dev.package.doubler-core]
opt-level = 2

[profile.dev.package.doubler]
opt-level = 2

[profile.dev.package.sparkleur-core]
opt-level = 2

[profile.dev.package.sparkleur]
opt-level = 2

[profile.dev.package.velour-core]
opt-level = 2

[profile.dev.package.velour]
opt-level = 2
