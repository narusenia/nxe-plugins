[package]
name = "nxe-dsp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Signal analysis shared by the NXE plugins, independent of any host or interface"

# Deliberately empty, for the same reason `<plugin>-core` is: this runs on the
# audio thread and must not reach a host API or a UI toolkit. It is also what
# lets every analyser be tested without a window
# (`docs/specifications/architecture.md`).
[dependencies]

# criterion is a dev dependency, so it never reaches a plugin binary. The rule
# above is about what the analysis links, not about what measures it.
[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "analysis"
harness = false
