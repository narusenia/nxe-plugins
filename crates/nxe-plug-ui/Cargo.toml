[package]
name = "nxe-plug-ui"
version.workspace = true
edition.workspace = true
# Links `vst3-sys` through `nih_plug`, which is GPLv3. See `LICENSING.md`.
license = "GPL-3.0-only"
repository.workspace = true
description = "The adapter between nih-plug's parameters and the nxe-ui widgets"

# **This is the crate that is allowed to know both**, and the reason `nxe-ui`
# is not. Putting these bindings in `nxe-ui` would make `examples/gallery` link
# nih-plug and stop being a standalone app, which is how UI work is iterated
# without opening a DAW (`docs/specifications/architecture.md`).
[dependencies]
nxe-ui = { workspace = true }
nih_plug = { workspace = true }
nih_plug_vizia = { workspace = true }
