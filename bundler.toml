# Display names for `cargo xtask bundle`. The bundler reads this from the
# workspace root, keyed by package name.
#
# Every plugin ships as `NXE <name>` (`AGENTS.md`). The crate keeps the bare
# name so paths stay short.
[air]
name = "NXE Air"

[doubler]
name = "NXE Doubler"

[velour]
name = "NXE Velour"

[sparkleur]
name = "NXE Sparkleur"

# **Provisional.** `REQ-VDP-014` wants the name settled before the first
# release, because `CLAP_ID` cannot change once a host has stored it. Nothing
# has shipped, so this is still free to move.
[vocal-depth]
name = "NXE Vocal Depth"
