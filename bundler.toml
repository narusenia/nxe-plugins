# Display names for `cargo xtask bundle`. The bundler reads this from the
# workspace root, keyed by package name.
#
# Every plugin ships as `NXE <name>` (`AGENTS.md`). The crate keeps the bare
# name so paths stay short.
[air]
name = "NXE Air"

[doubler]
name = "NXE Doubler"

[velour]
name = "NXE Velour"

[sparkleur]
name = "NXE Sparkleur"

# Settled in `DIO-15`, which is the last unit where it was free to move —
# `CLAP_ID` cannot change once a host has stored it (`REQ-DIO-014`).
[diorama]
name = "NXE Diorama"

[pumice]
name = "NXE Pumice"
