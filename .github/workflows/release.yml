# Cuts a release from a tag.
#
# **One release per series and drop: `<series>-<YYYY.MM>[.N][-beta.N]`**
# (`basic-2026.12`). `series.toml` says which plugins a series carries; every
# one of them is built, validated and zipped, and all the zips go to one draft
# release named `NXE <Series> <version>`. Releasing one plugin at a time put a
# row per plugin on the releases page; a drop is one row. Each plugin keeps its
# own version in its `Cargo.toml`, and the notes list them.
#
# Every plugin is on truce: macOS (universal; CLAP, VST3, AU v2) and Windows
# (CLAP, VST3). Linux is not built — decision 7 names macOS and Windows.
#
# **Nothing is signed or notarized.** Until there is an Apple Developer Program
# membership, macOS users clear the quarantine attribute by hand; the README says
# how, and that section comes out when signing lands (`INFRA-3`).

name: release

# A pull request that touches this file or `series.toml` builds Doubler
# without releasing it, so a change here is exercised before a tag depends on
# it. `workflow_dispatch` rebuilds a tag that is already pushed.
on:
  pull_request:
    paths: [.github/workflows/release.yml, series.toml]
  push:
    tags: ["*-20[0-9][0-9].*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to build, e.g. basic-2026.12"
        required: true

permissions:
  contents: write

jobs:
  # Reads the tag and `series.toml` once, so every later job builds the same
  # list. A plugin missing from `truce.toml` fails here, before any build.
  plan:
    runs-on: ubuntu-latest
    outputs:
      series: ${{ steps.plan.outputs.series }}
      title: ${{ steps.plan.outputs.title }}
      version: ${{ steps.plan.outputs.version }}
      plugins: ${{ steps.plan.outputs.plugins }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re, sys, tomllib
          series = tomllib.load(open("series.toml", "rb"))
          truce = {p["crate"]: p for p in tomllib.load(open("truce.toml", "rb"))["plugin"]}
          if os.environ["EVENT"] == "pull_request":
              key, version, plugins = "basic", "pr", ["doubler"]
          else:
              m = re.fullmatch(r"([a-z]+)-(\d{4}\.\d{2}(?:\.\d+)?(?:-beta\.\d+)?)", os.environ["TAG"])
              if not m or m[1] not in series:
                  sys.exit(f"::error::{os.environ['TAG']} is not <series>-<YYYY.MM>[.N][-beta.N] for a series in series.toml")
              key, version = m[1], m[2]
              plugins = series[key]["plugins"]
          missing = [p for p in plugins if p not in truce]
          if missing:
              sys.exit(f"::error::not in truce.toml: {' '.join(missing)}")
          print(f"series={key}")
          print(f"title=NXE {series[key]['name']} {version}")
          print(f"version={version}")
          entries = " ".join(p + ":" + truce[p]["fourcc"] for p in plugins)
          print(f"plugins={entries}")
          print(f"prerelease={'true' if '-beta.' in version else 'false'}")
          PY

  bundle:
    needs: plan
    strategy:
      # One platform failing should not throw away the other build: it is
      # easier to look at what did build than to guess from a cancelled run.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Same toolchain as `mise run check` and as a laptop: the version lives in
      # `mise.toml` and nowhere else.
      - uses: jdx/mise-action@v2

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      # Both macOS architectures, lipo'd into one bundle that runs on Apple
      # Silicon and Intel.
      - name: Add the second macOS architecture
        if: matrix.name == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install validators
        shell: bash
        run: |
          set -euo pipefail
          cargo install --locked --git https://github.com/free-audio/clap-validator clap-validator
          if [ "${{ matrix.name }}" = macos ]; then
            curl -fsSL -o "$RUNNER_TEMP/pluginval.zip" \
              https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
            unzip -oq "$RUNNER_TEMP/pluginval.zip" -d /Applications/
          else
            curl -fsSL -o "$RUNNER_TEMP/pluginval.zip" \
              https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip
            mkdir -p "$RUNNER_TEMP/pluginval"
            unzip -oq "$RUNNER_TEMP/pluginval.zip" -d "$RUNNER_TEMP/pluginval"
            echo "$RUNNER_TEMP/pluginval" >> "$GITHUB_PATH"
          fi

      # One plugin at a time into `target/bundled/<plugin>/`, so each zip holds
      # one plugin and the validators see exactly what goes in it.
      #
      # macOS is universal through `cargo truce package`, the only cargo-truce
      # command that builds both architectures: `build` makes the host's only,
      # and with `--target` 6.3.0 loses the AU dylib. The installer it also
      # writes is not shipped (decision 7 says zip); the bundles it staged are.
      #
      # **A bundle that fails the validators does not ship** (`V2-13`).
      # `cargo truce validate` reads installed bundles, so the shipped ones are
      # installed first. The AU also goes to the system folder, where the
      # registrar finds it, and the wait is for this plugin's own fourcc.
      - name: Bundle and validate
        shell: bash
        run: |
          set -euo pipefail
          for entry in ${{ needs.plan.outputs.plugins }}; do
            plugin="${entry%%:*}"
            fourcc="${entry##*:}"
            out="target/bundled/$plugin"
            mkdir -p "$out"
            if [ "${{ matrix.name }}" = macos ]; then
              rm -rf target/package
              cargo truce package -p "$plugin" --formats clap,vst3,au2 --no-notarize --no-sign
              for bundle in target/package/macos/plugin/*/*.clap \
                            target/package/macos/plugin/*/*.vst3 \
                            target/package/macos/plugin/*/*.component; do
                cp -R "$bundle" "$out/"
                lipo -archs "$bundle"/Contents/MacOS/*
              done
              mkdir -p ~/Library/Audio/Plug-Ins/CLAP ~/Library/Audio/Plug-Ins/VST3
              cp -R "$out"/*.clap ~/Library/Audio/Plug-Ins/CLAP/
              cp -R "$out"/*.vst3 ~/Library/Audio/Plug-Ins/VST3/
              sudo mkdir -p /Library/Audio/Plug-Ins/Components
              sudo cp -R "$out"/*.component /Library/Audio/Plug-Ins/Components/
              killall -9 AudioComponentRegistrar || true
              for _ in $(seq 1 30); do auval -a | grep -q "$fourcc" && break; sleep 2; done
              cargo truce validate --clap --pluginval --auval -p "$plugin" 2>&1 | tee validate.log
            else
              rm -rf target/bundles
              cargo truce build --clap --vst3 -p "$plugin"
              cp -R target/bundles/*.clap target/bundles/*.vst3 "$out/"
              cargo truce install --user --clap --vst3 -p "$plugin"
              cargo truce validate --pluginval -p "$plugin" 2>&1 | tee validate.log
              # CLAP directly: cargo-truce 6.3.0 passes `--test-filter` here,
              # which clap-validator replaced with `--exclude` in 2026-03. The
              # exclusion is the one truce makes on Windows — clap-validator
              # rejects Windows-style preset locations, so its preset-discovery
              # tests cannot pass on any plugin there. Its own log, because it
              # marks tests SKIPPED as a matter of course; it fails by status.
              clap-validator validate --exclude preset-discovery "$out"/*.clap 2>&1 | tee clap-validator.log
            fi
            if grep -E "SKIP|not found" validate.log >/dev/null; then
              echo "::error::validate skipped a step for $plugin"
              exit 1
            fi
            # Permissive (`LICENSING.md`): both texts, the user picks.
            cp LICENSE-MIT LICENSE-APACHE "$out/"
            version=$(grep -m1 '^version = ' "plugins/$plugin/$plugin/Cargo.toml" | cut -d'"' -f2)
            echo "nxe-$plugin-$version-${{ matrix.name }}" > "$out.name"
          done

      # `zip` is not on the Windows runners and `Compress-Archive` is not
      # anywhere else, so this is two steps rather than one clever one.
      - name: Zip
        if: matrix.name != 'windows'
        run: |
          cd target/bundled
          for name in *.name; do
            plugin="${name%.name}"
            (cd "$plugin" && zip -qr "../../../$(cat "../$name").zip" .)
          done

      - name: Zip
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          Get-ChildItem target/bundled -Filter *.name | ForEach-Object {
            $plugin = $_.BaseName
            $archive = (Get-Content $_.FullName).Trim()
            Compress-Archive -Path "target/bundled/$plugin/*" -DestinationPath "$archive.zip"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: nxe-*.zip
          if-no-files-found: error

  release:
    needs: [plan, bundle]
    # A pull request only proves the build; it never makes a release.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The plugins and their versions, then GitHub's generated notes.
      - name: Write the notes
        shell: bash
        run: |
          {
            echo "| Plugin | Version |"
            echo "|---|---|"
            for entry in ${{ needs.plan.outputs.plugins }}; do
              plugin="${entry%%:*}"
              name=$(python3 -c "import tomllib,sys; print(next(p['name'] for p in tomllib.load(open('truce.toml','rb'))['plugin'] if p['crate']==sys.argv[1]))" "$plugin")
              version=$(grep -m1 '^version = ' "plugins/$plugin/$plugin/Cargo.toml" | cut -d'"' -f2)
              echo "| $name | $version |"
            done
          } > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.plan.outputs.title }}
          body_path: notes.md
          files: artifacts/*.zip
          prerelease: ${{ needs.plan.outputs.prerelease }}
          # A draft, not a published release: the macOS bundle is unsigned, so
          # someone has to say the notes are right and press the button.
          draft: true
          generate_release_notes: true
