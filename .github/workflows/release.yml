# Cuts a release from a tag.
#
# **One plugin per tag: `<plugin>-v<version>`**, matching the crate directory
# (`doubler-v0.1.0`). Each plugin ships on its own schedule, so fixing one does
# not re-release the others — which is the same reason a plugin is self-contained
# enough to be split into its own repository (`AGENTS.md`).
#
# Builds on each platform's own runner: the plugins link a native UI stack, so
# there is no cross-compiling here beyond macOS's two architectures. One zip per
# platform is attached to a **draft** release.
#
# **Nothing is signed or notarized.** Until there is an Apple Developer Program
# membership, macOS users clear the quarantine attribute by hand; the README says
# how, and that section comes out when signing lands (`INFRA-3`).

name: release

on:
  push:
    tags: ["*-v*"]

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      # One platform failing should not throw away the other two builds: it is
      # easier to look at what did build than to guess from a cancelled run.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # `doubler-v0.1.0` names both what to build and what to call it. Split
      # once, in bash, so every later step reads the same two values.
      - name: Read the tag
        id: tag
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          plugin="${tag%-v*}"
          version="${tag##*-v}"
          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=nxe-$plugin-$version-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      # A tag that disagrees with the crate would ship the wrong thing under the
      # right name, and the artefacts would look correct while being wrong.
      - name: Check the tag against the crate version
        shell: bash
        run: |
          plugin="${{ steps.tag.outputs.plugin }}"
          manifest="plugins/$plugin/$plugin/Cargo.toml"
          crate=$(grep -m1 '^version = ' "$manifest" | cut -d'"' -f2)
          if [ "$crate" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::$manifest says $crate but the tag says ${{ steps.tag.outputs.version }}"
            exit 1
          fi

      # The list comes from nih-plug's own CI. Without them the baseview window
      # and the audio backends do not build.
      - name: Install Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl-dev libjack-dev \
            libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev \
            libxcursor-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev

      # Same toolchain as `mise run check` and as a laptop: the version lives in
      # `mise.toml` and nowhere else.
      - uses: jdx/mise-action@v2

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      # `bundle-universal` builds both macOS architectures and lipos them, so
      # one bundle runs on Apple Silicon and Intel.
      - name: Add the second macOS architecture
        if: matrix.name == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Bundle
        if: matrix.name == 'macos'
        run: cargo xtask bundle-universal ${{ steps.tag.outputs.plugin }} --release

      - name: Bundle
        if: matrix.name != 'macos'
        run: cargo xtask bundle ${{ steps.tag.outputs.plugin }} --release

      # The bundles link `vst3-sys` (GPLv3), so the binary is conveyed under
      # the GPL and the license text travels with it (`LICENSING.md`). The
      # corresponding source is this repository.
      - name: Put the license in the archive
        shell: bash
        run: cp LICENSE-GPL-3.0 target/bundled/LICENSE

      # `zip` is not on the Windows runners and `Compress-Archive` is not
      # anywhere else, so this is two steps rather than one clever one.
      - name: Zip
        if: matrix.name != 'windows'
        run: |
          cd target/bundled
          zip -r "../../${{ steps.tag.outputs.archive }}.zip" .

      - name: Zip
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/bundled/* -DestinationPath "${{ steps.tag.outputs.archive }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: nxe-*.zip
          if-no-files-found: error

  release:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          # A draft, not a published release: the macOS bundle is unsigned, so
          # someone has to say the notes are right and press the button.
          draft: true
          generate_release_notes: true
