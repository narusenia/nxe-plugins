# Verification for every change.
#
# Runs `mise run check` — the same entry point as the pre-commit hook and as a
# local run. That is the point: a change must not be able to pass here and fail
# on a laptop, or the other way round, so this workflow deliberately does not
# spell out `cargo fmt`/`clippy`/`test` itself.
#
# **On pushes to `main` as well as on pull requests.** Work on this repository
# goes straight to `main`, so a pull-request-only workflow would almost never
# run.

name: check

on:
  pull_request:
  push:
    branches: [main]

# A newer commit on the same branch makes an in-flight run pointless.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # macOS because that is where the plugins are developed and bundled, and
    # because the UI stack is the part most likely to break per platform. The
    # other two targets are built in the release workflow.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # mise owns the Rust version (`mise.toml`), so CI gets the same toolchain
      # as a laptop without repeating the number here.
      - uses: jdx/mise-action@v2

      - uses: Swatinem/rust-cache@v2

      - run: mise run check

      # A failed screenshot test leaves what it rendered here (`V2-4`).
      - name: Upload the rendered windows
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-macos
          path: target/screenshots/
          if-no-files-found: ignore
          retention-days: 14

  # **The windows on Windows** (`V2-4`). The full check runs on macOS only; this
  # job runs just the screenshot tests, because the rasteriser is the part that
  # differs per OS and each OS keeps its own baseline.
  screenshot-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --no-fail-fast -p doubler -p sparkleur -p velour -p air -p diorama -p pumice -p peek-level -p peek-vu -p peek-stereo -p peek-spectrum -p peek-spectrogram -p peek-loudness -p peek-scope -p peek -p fold -p fever -p buckle -p invert -p shear -p afterimage -p dew -p halo -p glint -p pollen -p meniscus -p prisma -p parasite window_matches_its_screenshot
      - name: Upload the rendered windows
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-windows
          path: target/screenshots/
          if-no-files-found: ignore
          retention-days: 14

  # Which plugins the validate jobs share out: one job per series in
  # `series.toml`, so a new series is validated without touching this file.
  # A plugin in `truce.toml` that no series lists would be validated by none of
  # them, so that fails here rather than passing unseen.
  series:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        shell: python
        run: |
          import json, os, tomllib
          series = tomllib.load(open("series.toml", "rb"))
          plugins = {p["crate"] for p in tomllib.load(open("truce.toml", "rb"))["plugin"]}
          listed = {name for s in series.values() for name in s["plugins"]}
          if plugins - listed:
              raise SystemExit(f"in truce.toml but in no series: {sorted(plugins - listed)}")
          matrix = [{"series": key, "plugins": " ".join(s["plugins"])} for key, s in series.items()]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"matrix={json.dumps(matrix)}\n")

  # **The v2 plugins against the industry validators**: auval (AU v2),
  # pluginval (VST3) and clap-validator (CLAP), through `cargo truce validate`
  # (`docs/implementation/v2-plan.md`, decision 8).
  #
  # **One job per series, side by side.** pluginval takes about a minute a
  # plugin, and 21 of them in one job took 20 minutes. `cargo truce` takes one
  # `-p` (a second replaces the first), so each job loops over its plugins.
  #
  # **clap-validator and auval first**, pluginval after: the first two take
  # seconds for every plugin, so what they catch shows before pluginval starts.
  #
  # A validator that is missing or a bundle that is not installed is reported
  # as SKIP rather than as a failure, so the log is grepped for it: a validate
  # step that checked nothing must not pass.
  validate:
    needs: series
    name: validate (${{ matrix.series }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.series.outputs.matrix) }}
    env:
      PLUGINS: ${{ matrix.plugins }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
        with:
          key: validate-${{ matrix.series }}

      - name: Cache tools
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/clap-validator
            /Applications/pluginval.app
          key: validate-tools-macos-pluginval-1.0.4-clapval-2026-11-24

      # `cargo-truce` itself comes from `mise.toml`, through mise-action above.
      - name: Install validators
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          cargo install --locked --git https://github.com/free-audio/clap-validator clap-validator
          curl -fsSL -o "$RUNNER_TEMP/pluginval.zip" \
            https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -oq "$RUNNER_TEMP/pluginval.zip" -d /Applications/

      - name: Install the plugins
        run: |
          for plugin in $PLUGINS; do
            cargo truce install --user --clap --vst3 --au2 -p "$plugin"
          done

      # **auval did not find a component installed for the user** — on the
      # runner, and on a development Mac where the DAWs listed it fine. The AU
      # registrar is what auval asks, and it did not pick up
      # `~/Library/Audio/Plug-Ins/Components`. A copy in the system folder and a
      # restarted registrar is what an installer would leave behind anyway.
      - name: Register the AU for auval
        run: |
          sudo mkdir -p /Library/Audio/Plug-Ins/Components
          for bundle in ~/Library/Audio/Plug-Ins/Components/*.component; do
            sudo cp -R "$bundle" /Library/Audio/Plug-Ins/Components/
          done
          killall -9 AudioComponentRegistrar || true
          for _ in $(seq 1 30); do
            auval -a | grep -q Nxeu && break
            sleep 2
          done
          auval -a | grep Nxeu

      - name: clap-validator and auval
        run: |
          set -e -o pipefail
          for plugin in $PLUGINS; do
            cargo truce validate --clap --auval -p "$plugin" 2>&1 | tee -a fast.log
          done
          if grep -E "SKIP|not found" fast.log >/dev/null; then
            echo "::error::validate skipped a step"
            exit 1
          fi

      - name: pluginval
        run: |
          set -e -o pipefail
          for plugin in $PLUGINS; do
            cargo truce validate --pluginval -p "$plugin" 2>&1 | tee -a pluginval.log
          done
          if grep -E "SKIP|not found" pluginval.log >/dev/null; then
            echo "::error::validate skipped a step"
            exit 1
          fi
