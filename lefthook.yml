# Git hooks managed by lefthook (installed via `mise run hooks:install`).
#
# Jobs are filtered by glob so a docs-only commit does not pay for clippy.
# `mise run check` stays the canonical full verification entry point.
pre-commit:
  parallel: true
  jobs:
    - name: fmt
      glob: "*.rs"
      run: cargo fmt --all -- --check
    - name: clippy
      glob: "*.rs"
      run: mise run clippy
