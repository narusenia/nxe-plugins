[package]
name = "velour-core"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Velour DSP, independent of any plugin host"

# nih-plug, Vizia and any host API stay out: that is what keeps a future AU
# wrapper possible and what lets the DSP be tested without a host
# (`.agents/rules/rust.md`, `REQ-VEL-015`). `nxe-audio` is held to the same
# rule, so depending on it does not weaken this.
[dependencies]
nxe-audio.workspace = true

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "engine"
harness = false
