[package]
name = "velour"
# **The plugin owns its version, not the workspace.** Releases are tagged
# `velour-v<version>`, so each plugin ships on its own schedule and a fix to one
# does not re-release the others (`docs/implementation/infra-plan.md`).
# `velour-core` moves with it: they are one shipping unit.
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Vocal presence saturator"

[lib]
# `rlib` alongside `cdylib` so the crate's own tests can link it. The plugin
# formats only ever load the `cdylib`.
crate-type = ["cdylib", "rlib"]

[dependencies]
velour-core = { workspace = true }
nih_plug = { workspace = true }
