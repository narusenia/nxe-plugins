[package]
name = "peek-core"
# Shared by every Peek plugin, so it moves with the series rather than with one
# plugin. Nothing has shipped yet.
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The measurements behind the Peek meters, independent of any plugin host"

# No host API and no UI toolkit (`.agents/rules/rust.md`): one measurement,
# read by a single meter and by `Peek`, has to give the same number in both.
[dependencies]
nxe-audio.workspace = true
nxe-dsp.workspace = true
