[package]
name = "vocal-depth"
# **The plugin owns its version, not the workspace** (`velour/Cargo.toml`).
# `vocal-depth-core` moves with it: they are one shipping unit.
version = "0.1.0"
edition.workspace = true
# Links `vst3-sys` through `nih_plug`, which is GPLv3. See `LICENSING.md`.
license = "GPL-3.0-only"
repository.workspace = true
description = "A mix processor that moves a voice forward and back"

[lib]
# `rlib` alongside `cdylib` so the crate's own tests can link it. The plugin
# formats only ever load the `cdylib`.
crate-type = ["cdylib", "rlib"]

# **No Vizia yet.** `VDP-4` ships without a window on purpose — the host's own
# parameter list is enough to hear whether the sound is right, and the interface
# is `VDP-9` once `ui.md` exists.
[dependencies]
vocal-depth-core = { workspace = true }
nih_plug = { workspace = true }
