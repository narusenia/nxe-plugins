[package]
name = "sparkleur-core"
# **The plugin owns its version, not the workspace** (`velour/Cargo.toml`).
# `sparkleur-core` moves with it: they are one shipping unit.
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Sparkleur DSP, independent of any plugin host"

# nih-plug, Vizia and any host API stay out: that is what keeps a future AU
# wrapper possible and what lets the DSP be tested without a host
# (`.agents/rules/rust.md`, `REQ-SPK-015`). `nxe-audio` is held to the same
# rule, so depending on it does not weaken this.
[dependencies]
nxe-audio.workspace = true
