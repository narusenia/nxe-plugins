[package]
name = "doubler"
# **The plugin owns its version, not the workspace.** Releases are tagged
# `doubler-v<version>`, so each plugin ships on its own schedule and a fix to one
# does not re-release the others (`docs/implementation/infra-plan.md`).
# `doubler-core` moves with it: they are one shipping unit.
#
# 2.x is `NXE Doubler 2` on truce. 0.x stays on `release/v0`.
version = "2.0.0"
edition.workspace = true
# No `vst3-sys` any more, so the permissive side. See `LICENSING.md`.
license = "MIT OR Apache-2.0"
repository.workspace = true
description = "Multi-voice doubler"

[lib]
crate-type = ["cdylib", "rlib"]

# `cargo truce build` turns on one format per build. `au` is macOS only, so it
# is not a default: a Windows `cargo test` must not try to build the AU shim.
[features]
default = ["clap", "vst3"]
clap = ["dep:truce-clap", "dep:clap-sys"]
vst3 = ["dep:truce-vst3"]
au = ["dep:truce-au"]

[dependencies]
doubler-core = { workspace = true }
nxe-dsp = { workspace = true }
truce = { workspace = true }
truce-core = { workspace = true }
truce-params = { workspace = true }
truce-loader = { workspace = true }
truce-egui = { workspace = true }
egui = { workspace = true }
truce-clap = { workspace = true, optional = true }
clap-sys = { workspace = true, optional = true }
truce-vst3 = { workspace = true, optional = true }
truce-au = { workspace = true, optional = true }

# `rt-paranoid` panics on a heap allocation inside `process()` — the rule
# `.agents/rules/rust.md` states, checked by the tests rather than by review.
# A dev-dependency feature, so the shipped binary does not carry the checker.
[dev-dependencies]
truce = { workspace = true, features = ["rt-paranoid"] }
truce-test = { workspace = true }
