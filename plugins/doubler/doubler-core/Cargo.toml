[package]
name = "doubler-core"
version = "0.1.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Doubler DSP, independent of any plugin host"

# nih-plug, Vizia and any host API stay out: that is what keeps a future AU
# wrapper possible and what lets the DSP be tested without a host
# (`.agents/rules/rust.md`). `nxe-audio` is held to the same rule, so depending
# on it does not weaken this.
#
# `DelayLine` lived here until Vocal Depth asked for it (`VDP-1`) and it moved
# to `nxe-audio` — a shared module is created by the second caller, not in
# anticipation of one (`docs/specifications/architecture.md`).
[dependencies]
nxe-audio.workspace = true

# criterion is a dev dependency, so it never reaches a plugin binary. The rule
# above is about what the DSP links, not about what measures it.
[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "engine"
harness = false
